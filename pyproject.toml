[project]
name = "bijotel"
version = "2.13.1"
description = "Tamper-evident HMAC audit chain for LLM applications. HMAC-SHA256 chain, content-addressable storage, pre-call policy gate, regression detection, Ed25519-signed exports, chain segmentation and archival, full REST API + dashboard surface, OTel GenAI semconv v1.41 (cache + reasoning tokens, streaming timing), MCP invocation sealing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Octavian Untilă" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
keywords = [
    "llm",
    "audit",
    "hmac",
    "tamper-evident",
    "observability",
    "opentelemetry",
    "ai-safety",
    "compliance",
    "eu-ai-act",
    "policy-gate",
    "regression-detection",
    "forensic",
    "genai",
    "anthropic",
    "openai",
]
dependencies = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-semantic-conventions>=0.48b0",
    "rfc8785>=0.1.4",
    "numpy>=1.24",
    "cryptography>=42.0",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.40.0",
    "opentelemetry-instrumentation-anthropic>=0.40.0",
]
openai = [
    "openai>=1.0",
]
fingerprint = [
    "sentence-transformers>=2.7",
]
ast = [
    "tree-sitter>=0.21",
    "tree-sitter-bash>=0.21",
]
api = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "python-multipart>=0.0.6",
]
mcp = [
    "mcp>=1.0",
]
all = [
    "anthropic>=0.40.0",
    "opentelemetry-instrumentation-anthropic>=0.40.0",
    "openai>=1.0",
    "sentence-transformers>=2.7",
    "tree-sitter>=0.21",
    "tree-sitter-bash>=0.21",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "python-multipart>=0.0.6",
    "mcp>=1.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
    "python-dotenv>=1.0.0",
    "build>=1.0",
    "twine>=5.0",
    "coverage>=7.0",
]

[project.urls]
Documentation = "https://github.com/octavuntila-prog/BIJOTEL"
Issues = "https://github.com/octavuntila-prog/BIJOTEL/issues"
Changelog = "https://github.com/octavuntila-prog/BIJOTEL/blob/main/CHANGELOG.md"
Source = "https://github.com/octavuntila-prog/BIJOTEL"

[project.scripts]
bijotel = "bijotel.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bijotel"]
# Force-include the prebuilt dashboard so `bijotel serve --dashboard`
# finds index.html / assets/* at runtime. Build step:
#     cd src/bijotel/dashboard && npm run build
# (this is a wheel-time include; the SOURCE files in dashboard/ are not
# shipped — only the built `dashboard_dist/`.)
artifacts = ["src/bijotel/dashboard_dist/**/*"]

[tool.hatch.build.targets.sdist]
# Exclude the heavy raw dashboard tree (519KB of node-source) from the
# sdist, but keep the built dashboard_dist so the sdist is self-contained
# and `pip install <sdist>` works without needing npm.
exclude = [
    "src/bijotel/dashboard/node_modules",
    "src/bijotel/dashboard/src",
    "src/bijotel/dashboard/index.html",
    "src/bijotel/dashboard/package.json",
    "src/bijotel/dashboard/vite.config.js",
    "ops",   # internal GENA ops/monitoring scripts — version-controlled, not shipped
]
artifacts = ["src/bijotel/dashboard_dist/**/*"]

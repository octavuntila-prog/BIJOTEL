name: release

# Tag-triggered release: build + publish wheel->PyPI and image->ghcr, gated on
# the same test+lint as CI. Ends the manual-release drift that left ghcr `latest`
# two versions behind PyPI (see CHANGELOG 2.14.2 / audit 2026-06-07 M1/M2).
#
# Prerequisite (one-time): add repo secret `PYPI_API_TOKEN` (a PyPI project-
# scoped API token). The ghcr push uses the auto-provided GITHUB_TOKEN.
#
# Release flow:  bump version in pyproject.toml + src/bijotel/__init__.py +
# CHANGELOG, commit, then `git tag vX.Y.Z && git push origin vX.Y.Z`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Gate — identical checks to ci.yml; a release never ships if these fail.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[anthropic,ast,api,dev]"
      - run: ruff check .
      - run: |
          coverage run --source=src/bijotel -m pytest -q
          coverage report --fail-under=80

  # Wheel + sdist -> PyPI.
  pypi:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build twine
      # Guard: the git tag must equal the packaged version, so we can never
      # publish vX.Y.Z while pyproject still says something else.
      - run: |
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG=${GITHUB_REF_NAME#v}
          echo "tag=$TAG pyproject=$PKG"
          test "$PKG" = "$TAG" || { echo "::error::tag $TAG != pyproject version $PKG"; exit 1; }
      - run: python -m build
      - run: twine check dist/*
      # --skip-existing keeps the workflow idempotent: if the version was
      # already published (e.g. an out-of-band `twine upload` from ~/.pypirc),
      # the job is a green no-op instead of failing on a duplicate.
      - run: twine upload --skip-existing dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  # Image -> ghcr.io (tag X.Y.Z without the leading v, plus :latest).
  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Dockerfile COPYs dist/bijotel-*.whl; a clean checkout yields exactly one
      # wheel, so the glob stays unambiguous (the "one wheel only" rule).
      - run: pip install build && python -m build --wheel
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ver
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/octavuntila-prog/bijotel:${{ steps.ver.outputs.v }}
            ghcr.io/octavuntila-prog/bijotel:latest

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        # [anthropic,ast,api,dev] = SDK + tree-sitter for AST tests + fastapi
        # for API tests + pytest+ruff. Excludes [fingerprint] (sentence-
        # transformers, ~1GB heavy) which is not needed for the test suite.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[anthropic,ast,api,dev]"
      - name: Lint with ruff
        run: ruff check .
      - name: Run tests with coverage
        # `coverage` is in the [dev] extra. We measure on src/bijotel only
        # so test scaffolding doesn't dilute the number. --fail-under=80
        # leaves slack below the current ~86% measurement so a transient
        # 1-2-point dip doesn't break CI for unrelated reasons; raise the
        # floor when the trend rises.
        run: |
          coverage run --source=src/bijotel -m pytest -q
          coverage report --fail-under=80
          coverage xml
      - name: Coverage summary
        if: matrix.python-version == '3.12'
        run: |
          PCT=$(coverage report | tail -1 | awk '{print $NF}' | tr -d '%')
          echo "Coverage: ${PCT}%"
          echo "coverage_pct=${PCT}" >> "$GITHUB_OUTPUT"
        id: cov

  # Dependency CVE gate (audit 2026-06-07 G3). bijotel's shipped dep tree
  # (api+ast+anthropic) audits clean today; this fails CI on any NEW known
  # vulnerability, catching supply-chain drift early. Excludes the heavy
  # [fingerprint]/torch extra to match the test job's scope; add an
  # `--ignore-vuln <ID>` (with a comment) if an unfixable transitive CVE lands.
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[anthropic,ast,api]" pip-audit
      - name: Audit dependency tree for known CVEs
        run: pip-audit --desc

# Compose patch — environment additions per-ecosystem.
#
# For each LLM-active ecosystem (v3-atelier, v4-piata, v9-oracle, v8-ambasador),
# add `BIJOTEL_HMAC_SECRET` to the `environment:` block.
#
# Existing environment (v3-atelier example):
#   environment:
#     - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
#     - SUBSTRATE_CONFIG=/app/config/substrate.yaml
#     - ECOSYSTEM_ID=v3-atelier
#
# After patch:
#   environment:
#     - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
#     - SUBSTRATE_CONFIG=/app/config/substrate.yaml
#     - ECOSYSTEM_ID=v3-atelier
#     - BIJOTEL_HMAC_SECRET=${BIJOTEL_HMAC_SECRET}     # NEW
#
# Volumes already include `shared-data:/data` via `<<: *ecosystem` anchor —
# no volume changes needed. bijotel_chain.db lands at /data/bijotel_chain.db
# alongside existing traces.db.

# Apply method (idempotent): patch_compose.py reads docker-compose.yml,
# detects `BIJOTEL_HMAC_SECRET=` per service, adds if missing.

# ─── YAML reference patch (for human review) ─────────────────
# v3-atelier:
#   environment:
#     - BIJOTEL_HMAC_SECRET=${BIJOTEL_HMAC_SECRET}
# v4-piata:
#   environment:
#     - BIJOTEL_HMAC_SECRET=${BIJOTEL_HMAC_SECRET}
# v9-oracle:
